<table mat-table [dataSource]="data" class="table table-striped shadow-sm m-0 p-0">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>الإسم</th>
    <td mat-cell *matCellDef="let noteClient">{{ noteClient.name }}</td>
    <td mat-footer-cell *matFooterCellDef style="width: 500px">الأجمالي</td>
  </ng-container>
  <ng-container matColumnDef="quantity">
    <th mat-header-cell *matHeaderCellDef>الكمية</th>
    <td mat-cell *matCellDef="let noteClient">{{ noteClient?.quantity }}</td>
    <td mat-footer-cell *matFooterCellDef>{{ getTotal() }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell text-center" [colSpan]="2">لا يوجد بيانات</td>
  </tr>
</table>
