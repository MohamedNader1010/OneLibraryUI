<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="
                border-radius: 56px;
                padding: 0.3rem;
                background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);
            "
        >
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-8 px-4 sm:px-8" style="border-radius: 53px; max-width: 30rem">
                <div class="gap-4 flex flex-col items-center">
                    <p class="text-surface-900 dark:text-surface-0 font-bold text-3xl lg:text-4xl mb-2">Confirmation Failed</p>
                    <p>Your account could not be confirmed. Please try again later.</p>
                    <img src="assets/images/firewall.svg" alt="Access denied" class="mb-8" width="80%" />
                    <div class="col-span-12 mt-8 text-center">
                        <button
                            (onClick)="resendConfirmationEmail()"
                            severity="warn"
                            [disabled]="isSubmitting"
                            mat-raised-button
                            color="warn"
                        >
                            {{ buttonText }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
