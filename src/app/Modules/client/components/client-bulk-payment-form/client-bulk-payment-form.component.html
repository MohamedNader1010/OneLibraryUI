<div class="container w-100">
    <h2 mat-dialog-title>دفع طلبات العميل</h2>
    <mat-dialog-content>
        <form [formGroup]="form" class="d-flex flex-column mat-dialog-content">
            <div class="row">
                <div class="col">
                    <mat-form-field appearance="fill" class="w-100" color="warn">
                        <mat-label>المبلغ</mat-label>
                        <input type="number" matInput formControlName="amount" min="0" />
                    </mat-form-field>
                </div>
                <div class="col">
                    <mat-form-field appearance="fill" class="w-100" color="warn">
                        <mat-label>طريقة الدفع</mat-label>
                        <mat-select formControlName="paymentMethod">
                            <mat-option
                                *ngFor="let paymentMethod of getEnumValues(enums.paymentMethod)"
                                [value]="paymentMethod"
                                >{{ mappers.PaymentMethod.get(paymentMethod) }}</mat-option
                            >
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </form>
    </mat-dialog-content>
    <div mat-dialog-actions class="d-flex justify-content-end">
        <button type="button" mat-stroked-button color="warn" (click)="onNoClick()">{{ 'button.back' | translate }}</button>
        <button
            mat-raised-button
            type="submit"
            color="warn"
            (click)="handleSubmit()"
            [disabled]="!form.valid || isSubmitting"
            class="mx-2 px-4"
        >
            {{ isSubmitting ? ('button.wait' | translate) : ('button.save' | translate) }}
        </button>
    </div>
</div>
